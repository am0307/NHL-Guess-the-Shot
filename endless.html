<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Load dark mode preference to prevent flashing -->
    <script>
        
        // Check if the user has a preference for dark mode by default/from a previous visit
        const userPreference = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const isDarkModeOn = localStorage.getItem("darkmode")

        if (isDarkModeOn === "active" || (userPreference && isDarkModeOn === null)) {
            document.documentElement.setAttribute("data-bs-theme", "dark");
        } else {
            document.documentElement.setAttribute("data-bs-theme", "light");
        }
    </script>
    <style>
        .darkmode body { background: #222; }
        .darkmode .light-only { display: none; }
        html:not(.darkmode) .dark-only { display: none; }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PuckGuessr</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="images/favicon.svg">
</head>
<body>
    <!-- Header -->
    <div class="container">
        <header class="d-flex flex-wrap justify-content-center py-3 border-bottom"> 

            <!-- Logo -->
            <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none mx-2" style="margin-top: 17px;"> 
                <img src="images/logo.svg" alt="Logo" width="300" height="80"/>
            </a>
            
            <!-- Navigation Bar -->
            <div class="d-flex align-items-center">
                <ul class="nav nav-pills">
                    <li class="nav-item">
                        <a href="index.html" class="nav-link">Daily</a>
                    </li>
                    <li class="nav-item">
                        <a href="endless.html" class="nav-link ms-0 active" aria-current="page">Endless</a>
                    </li>
                </ul>
                
                <!-- Dark mode toggle button -->
                <button id="theme-switch" class="btn border-0 p-0 d-flex justify-content-center align-items-center" style="height: 40px; width: 40px; border-radius: 50%; margin-left: 8px;">
                    <!-- Sun icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"><path d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q55 0 101-24.5t75-65.5q2 13 3 26.5t1 27.5q0 150-105 255T480-120Z"/></svg>
                    <!-- Moon icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"><path d="M480-280q-83 0-141.5-58.5T280-480q0-83 58.5-141.5T480-680q83 0 141.5 58.5T680-480q0 83-58.5 141.5T480-280ZM200-440H40v-80h160v80Zm720 0H760v-80h160v80ZM440-760v-160h80v160h-80Zm0 720v-160h80v160h-80ZM256-650l-101-97 57-59 96 100-52 56Zm492 496-97-101 53-55 101 97-57 59Zm-98-550 97-101 59 57-100 96-56-52ZM154-212l101-97 55 53-97 101-59-57Z"/></svg>
                </button>
            </div>
        </header>
    </div>

    <!-- Show mask video -->
    <div class="d-flex justify-content-center align-items-center">
        <video id="mask-vid" width="889" height="500" autoplay loop muted playsinline></video>
    </div>
    <!-- Show original video and source -->
    <div class="d-flex justify-content-center">
        <div style="width: 889px;">
            <video id="org-vid" class="d-none w-100" height="500" autoplay loop muted playsinline></video>
            <h6 id="video-source" class="link-body-emphasis d-none">Video sourced from <a id="video-source-link" target="_blank" href="#"></a></h6>
        </div>
    </div>
    <!-- Correct guess alert -->
    <div id="win-alert-container" class="d-flex justify-content-center mb-0">
        <div id="win-alert" class="alert alert-success d-none col-lg-4 col-md-6 col-10 mb-0" role="alert">
            <h4 class="text-center mb-1">Bar down!</h4>
            <h5 class="text-center" id="win-answer"></h5>
            <a href="endless.html" class="win-loss-btn btn btn-dark w-50 mt-2 mx-auto d-block text-center">
                    Play Again
            </a>
            <!-- Toggle sharable result -->
            <button type="button" class="win-loss-btn share-result-btn btn btn-dark mx-auto d-block text-center my-2" data-bs-toggle="modal" data-bs-target="#share-result-win">
                Share Result
            </button>
            <!-- Sharable result -->
            <div class="modal fade" id="share-result-win" tabindex="-1" aria-labelledby="share-result-label" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="share-result-win-label">Share Result</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        ...
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="button" class="btn btn-primary colour-changing" id="copy-win-btn">Copy</button>
                    </div>
                    </div>
                </div>
            </div>
            <p class="streak-text text-center mt-3 mb-1 d-none"></p>
        </div>
    </div>
    <!-- Loss alert -->
    <div id="loss-alert-container" class="d-flex justify-content-center mb-0">
        <div id="loss-alert" class="alert alert-danger d-none col-lg-4 col-md-6 col-10 mb-0" role="alert">
            <h4 class="text-center mb-1">Missed the net by a mile!</h4>
            <h5 class="text-center" id="loss-answer"></h5>
            <a href="endless.html" class="win-loss-btn btn btn-dark w-50 mt-2 mx-auto d-block text-center">
                Play Again
            </a>
            <!-- Toggle sharable result -->
            <button type="button" class="win-loss-btn share-result-btn btn btn-dark mx-auto d-block text-center my-2" data-bs-toggle="modal" data-bs-target="#share-result-loss">
                Share Result
            </button>
            <!-- Share daily result -->
            <!-- Sharable result -->
            <div class="modal fade" id="share-result-loss" tabindex="-1" aria-labelledby="share-result-label" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="share-result-loss-label">Share Result</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        ...
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="button" class="btn btn-primary colour-changing" id="copy-loss-btn">Copy</button>
                    </div>
                    </div>
                </div>
            </div>
            <p class="streak-text text-center mt-3 mb-1 d-none"></p>
        </div>
    </div>
    <!-- Create player input form -->
    <div class="container">
        <form class="form" autocomplete="off" id="player-form">
            <div class="row justify-content-center align-items-center g-2" style="margin-bottom: 24px;">
                <div class="col-lg-4 col-6 px-0 position-relative">
                    <input class="form-control" type="text" id="player-input" name="player" placeholder="Guess a player" autocomplete="off">
                    <!-- Player dropdown menu -->
                    <ul id="player-dropdown" class="dropdown-menu shadow-sm"></ul>
                </div>
                <!-- Forfeit UI -->
                <div class="col-auto ms-2">
                    <button id="start-forfeit" type="button" class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#forfeit-modal">
                        Give Up?
                    </button>
                </div>
                <div class="modal fade" id="forfeit-modal" tabindex="-1" role="dialog" aria-labelledby="forfeit-modal-label" aria-hidden="true">
                    <div class="modal-dialog" role="document">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title fw-bold" id="forfeit-modal-label">Are you sure?</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>
                            <div class="modal-body">
                                The game will end if you forfeit!
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                <button id="give-up" type="button" class="btn btn-danger" data-bs-dismiss="modal">Confirm</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div class="container-fluid text-center my-3">
        <div class="row justify-content-center">
            <!-- Outer wrapper controlling grid width across screen breakpoints -->
            <div class="col-9 col-md-8 col-xxl-6">
                <!-- Headers -->
                <div class="row row-cols-5 flex-nowrap justify-content-center my-3 d-flex align-items-stretch">
                    <h6 class="column-headers colour-changing column-tooltip col mb-2 px-2 py-2 rounded mb-0 d-flex align-items-center justify-content-center" data-bs-placement="top" title="The player's current team.">Team</h6>
                    <h6 class="column-headers colour-changing column-tooltip col mb-2 px-2 py-2 rounded mb-0 d-flex align-items-center justify-content-center" data-bs-placement="top" title="The player's division, appears yellow when player conferences match.">Div.</h6>
                    <h6 class="column-headers colour-changing column-tooltip col mb-2 px-2 py-2 rounded mb-0 d-flex align-items-center justify-content-center" data-bs-placement="top" title="The player's number, appears yellow when within 10 of the correct answer.">#</h6>
                    <h6 class="column-headers colour-changing column-tooltip col mb-2 px-2 py-2 rounded mb-0 d-flex align-items-center justify-content-center" data-bs-placement="top" title="The player's country of birth.">Birth Nation</h6>
                    <h6 class="column-headers colour-changing column-tooltip col mb-2 px-2 py-2 rounded mb-0 d-flex align-items-center justify-content-center" data-bs-placement="top" title="The player's age, appears yellow when within 3 of the correct answer.">Age</h6>
                </div>
                <!-- Display guess rows -->
                <div id="guess-1">
                    <div class="row row-cols-5 flex-nowrap justify-content-center">
                        <div class="player-info-1 shadow-sm col my-2 border-2 border team"></div>
                        <div class="player-info-1 shadow-sm col my-2 border-2 border division"></div>
                        <div class="player-info-1 shadow-sm col my-2 border-2 border number"></div>
                        <div class="player-info-1 shadow-sm col my-2 border-2 border nation"></div>
                        <div class="player-info-1 shadow-sm col my-2 border-2 border age"></div>
                    </div>
                </div>
                <div id="guess-2">
                    <div class="row row-cols-5 flex-nowrap justify-content-center">
                        <div class="player-info-2 shadow-sm col my-2 border-2 border team"></div>
                        <div class="player-info-2 shadow-sm col my-2 border-2 border division"></div>
                        <div class="player-info-2 shadow-sm col my-2 border-2 border number"></div>
                        <div class="player-info-2 shadow-sm col my-2 border-2 border nation"></div>
                        <div class="player-info-2 shadow-sm col my-2 border-2 border age"></div>
                    </div>
                </div>
                <div id="guess-3">
                    <div class="row row-cols-5 flex-nowrap justify-content-center">
                        <div class="player-info-3 shadow-sm col my-2 border-2 border team"></div>
                        <div class="player-info-3 shadow-sm col my-2 border-2 border division"></div>
                        <div class="player-info-3 shadow-sm col my-2 border-2 border number"></div>
                        <div class="player-info-3 shadow-sm col my-2 border-2 border nation"></div>
                        <div class="player-info-3 shadow-sm col my-2 border-2 border age"></div>
                    </div>
                </div>
                <div id="guess-4">
                    <div class="row row-cols-5 flex-nowrap justify-content-center">
                        <div class="player-info-4 shadow-sm col my-2 border-2 border team"></div>
                        <div class="player-info-4 shadow-sm col my-2 border-2 border division"></div>
                        <div class="player-info-4 shadow-sm col my-2 border-2 border number"></div>
                        <div class="player-info-4 shadow-sm col my-2 border-2 border nation"></div>
                        <div class="player-info-4 shadow-sm col my-2 border-2 border age"></div>
                    </div>
                </div>
                <div id="guess-5">
                    <div class="row row-cols-5 flex-nowrap justify-content-center">
                        <div class="player-info-5 shadow-sm col my-2 border-2 border team"></div>
                        <div class="player-info-5 shadow-sm col my-2 border-2 border division"></div>
                        <div class="player-info-5 shadow-sm col my-2 border-2 border number"></div>
                        <div class="player-info-5 shadow-sm col my-2 border-2 border nation"></div>
                        <div class="player-info-5 shadow-sm col my-2 border-2 border age"></div>
                    </div>
                </div>
                <div id="guess-6">
                    <div class="row row-cols-5 flex-nowrap justify-content-center">
                        <div class="player-info-6 shadow-sm col my-2 border-2 border team"></div>
                        <div class="player-info-6 shadow-sm col my-2 border-2 border division"></div>
                        <div class="player-info-6 shadow-sm col my-2 border-2 border number"></div>
                        <div class="player-info-6 shadow-sm col my-2 border-2 border nation"></div>
                        <div class="player-info-6 shadow-sm col my-2 border-2 border age"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        window.gameMode = "endless"; 
        window.PUBLIC_R2_URL = "https://media.puckguessr.com";
    </script>

    <!-- Load js files -->
    <script src="js/theme-logic.js"></script>
    <script type="module" src="js/game-logic.js"></script>
</body>
</html>
