{% from "bootstrap5/form.html" import render_form %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Shot</title>

    <!-- Bootstrap CSS -->
    {{ bootstrap.load_css() }}
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- Create player input form -->
    <form class="form" autocomplete="off" id="player-form">
        <div class="row row-cols-5 mt-5 mb-2 justify-content-center">
            <div class="col-4 px-0">
                <input class="form-control" type="text" id="player-input" name="player" placeholder="Guess a player" autocomplete="off">
                
                <!-- Player dropdown menu -->
                <ul id="player-dropdown" class="dropdown-menu shadow-sm">
                    {% for player in players %}
                        <li><a class="dropdown-item player-option" data-value="{{ player }}">{{ player }}</a></li>
                    {% endfor %}
                </ul>
            </div>
        </div>
    </form>
    <!-- Show headers for each column's category -->
    <div id="column-headers" class="container-fluid text-center col-sm-10 col-md-10 col-lg-8 col-xl-6 col-xxl-4">
        <div class="row row-cols-5 flex-nowrap justify-content-center my-3">
            <h6 class="col mx-1 m-3 mt-2 px-1 py-2 border rounded mb-0" style="background-color: #1434A4; color: white;">Team</h6>
            <h6 class="col mx-1 m-3 mt-2 px-1 py-2 border rounded mb-0" style="background-color: #1434A4; color: white;">Division</h6>
            <h6 class="col mx-1 m-3 mt-2 px-1 py-2 border rounded mb-0" style="background-color: #1434A4; color: white;">Num.</h6>
            <h6 class="col mx-1 m-3 mt-2 px-1 py-2 border rounded mb-0" style="background-color: #1434A4; color: white;">Nation</h6>
            <h6 class="col mx-1 m-3 mt-2 px-1 py-2 border rounded mb-0" style="background-color: #1434A4; color: white;">Age</h6>
        </div>
    </div>
    <!-- Display guess rows -->
    <div id="guess-rows" class="container-fluid text-center col-sm-12 col-md-12 col-lg-10 col-xl-8 col-xxl-6">
        <div id="guess-1">
            <div class="row flex-nowrap justify-content-center">
                <div class="player-info-1 col m-2 px-2 border-2 bg-white border team"></div>
                <div class="player-info-1 col m-2 px-2 border-2 bg-white border division"></div>
                <div class="player-info-1 col m-2 px-2 border-2 bg-white border number"></div>
                <div class="player-info-1 col m-2 px-2 border-2 bg-white border nation"></div>
                <div class="player-info-1 col m-2 px-2 border-2 bg-white border age"></div>
            </div>
        </div>
        <div id="guess-2">
            <div class="row flex-nowrap justify-content-center">
                <div class="player-info-2 col m-2 px-2 border-2 bg-white border team"></div>
                <div class="player-info-2 col m-2 px-2 border-2 bg-white border division"></div>
                <div class="player-info-2 col m-2 px-2 border-2 bg-white border number"></div>
                <div class="player-info-2 col m-2 px-2 border-2 bg-white border nation"></div>
                <div class="player-info-2 col m-2 px-2 border-2 bg-white border age"></div>
            </div>
        </div>
        <div id="guess-3">
            <div class="row flex-nowrap justify-content-center">
                <div class="player-info-3 col m-2 px-2 border-2 bg-white border team"></div>
                <div class="player-info-3 col m-2 px-2 border-2 bg-white border division"></div>
                <div class="player-info-3 col m-2 px-2 border-2 bg-white border number"></div>
                <div class="player-info-3 col m-2 px-2 border-2 bg-white border nation"></div>
                <div class="player-info-3 col m-2 px-2 border-2 bg-white border age"></div>
            </div>
        </div>
        <div id="guess-4">
            <div class="row flex-nowrap justify-content-center">
                <div class="player-info-4 col m-2 px-2 border-2 bg-white border team"></div>
                <div class="player-info-4 col m-2 px-2 border-2 bg-white border division"></div>
                <div class="player-info-4 col m-2 px-2 border-2 bg-white border number"></div>
                <div class="player-info-4 col m-2 px-2 border-2 bg-white border nation"></div>
                <div class="player-info-4 col m-2 px-2 border-2 bg-white border age"></div>
            </div>
        </div>
        <div id="guess-5">
            <div class="row flex-nowrap justify-content-center">
                <div class="player-info-5 col m-2 px-2 border-2 bg-white border team"></div>
                <div class="player-info-5 col m-2 px-2 border-2 bg-white border division"></div>
                <div class="player-info-5 col m-2 px-2 border-2 bg-white border number"></div>
                <div class="player-info-5 col m-2 px-2 border-2 bg-white border nation"></div>
                <div class="player-info-5 col m-2 px-2 border-2 bg-white border age"></div>
            </div>
        </div>
        <div id="guess-6">
            <div class="row flex-nowrap justify-content-center">
                <div class="player-info-6 col m-2 px-2 border-2 bg-white border team"></div>
                <div class="player-info-6 col m-2 px-2 border-2 bg-white border division"></div>
                <div class="player-info-6 col m-2 px-2 border-2 bg-white border number"></div>
                <div class="player-info-6 col m-2 px-2 border-2 bg-white border nation"></div>
                <div class="player-info-6 col m-2 px-2 border-2 bg-white border age"></div>
            </div>
        </div>
    </div>

    <script>
        // Retrieve elements
        const input = document.getElementById('player-input');
        const dropdown = document.getElementById('player-dropdown');
        const form = document.getElementById('player-form');
        const items = dropdown.querySelectorAll('.player-option');
        const playerData = {{ player_data | tojson }};

        let guessCount = 0; // Guess number tracker

        // Show and filter dropdown as the user types
        input.addEventListener('input', function() {

            const user_input = input.value.toLowerCase();
            let hasVisibleItems = false;

            // Loop through each item and show players based on the filter
            items.forEach(item => {
                const text = item.textContent.toLowerCase();
                if (text.includes(user_input) && user_input.length > 0) {
                    item.parentElement.style.display = 'block';
                    hasVisibleItems = true;
                } else {
                    item.parentElement.style.display = 'none';
                }
            });

            // Show or hide the dropdown container based on matches
            dropdown.style.display = (hasVisibleItems && user_input.length > 0) ? 'block' : 'none';
        });

        // Handle click on a list item
        items.forEach(item => {
            item.addEventListener('click', function(e) {
                e.preventDefault();

                let playerName = this.getAttribute('data-value'); // Get clicked player's name
                input.value = playerName; // Set form input to clicked player's name
                dropdown.style.display = 'none'; // Hide dropdown
                
                guessCount++; // Increment guess count
                addGuessInfo(playerName); // Add player info in guess row
                
                input.value = ""; // Clear form
                
                flipBoxes(); // Flip boxes
            });
        });

        // Hide dropdown on outside click
        document.addEventListener('click', function(e) {
            if (!input.contains(e.target) && !dropdown.contains(e.target)) {
                dropdown.style.display = 'none';
            }
        });

        // Prevent submission by entering
        form.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
            }
        });

        // Make boxes flip
        function flipBoxes() {
            var boxes = document.getElementsByClassName(`player-info-${guessCount}`);
            var boxArray = Array.from(boxes);
            boxArray.map(function (box, i) {
                box.classList.add("flip");
                box.style.animationDelay = `${i * 250}ms`;
            });
        }

        // Add guess info to the next row of boxes
        function addGuessInfo(playerName) {
            // Limit guesses to 6
            if (guessCount > 6)
                return;

            // Get guess row and its boxes
            const guessRow = document.getElementById(`guess-${guessCount}`);
            const team = guessRow.querySelector(".team");
            const division = guessRow.querySelector(".division");
            const number = guessRow.querySelector(".number");
            const nation = guessRow.querySelector(".nation");
            const age = guessRow.querySelector(".age");

            // Retrieve the guessed player's info
            const player_info = playerData[playerName];
            if (player_info) {
                team.innerText = player_info.team;
                division.innerText = player_info.division;
                number.innerText = player_info.number;
                nation.innerText = player_info.nation;
                age.innerText = player_info.age;
            }
        }
    </script>
</body>
</html>
